# Server Configuration
server.port=8080
spring.application.name=interiorai-backend

# File Upload Limits (supports up to 100MB video uploads as per ADWP-69-75)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Firebase Configuration
# Path to service account JSON (or supply via environment variable)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:interiorai-studio.appspot.com}
# Local development falls back to mock verification/storage when credentials are absent.
# Set FIREBASE_MOCK_ENABLED=false in production to require Firebase Admin credentials.
firebase.mock.enabled=${FIREBASE_MOCK_ENABLED:true}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.interiorai.backend=INFO
logging.level.org.springframework.security=WARN
