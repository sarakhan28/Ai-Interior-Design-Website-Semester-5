# Test profile configuration (used automatically by `mvn test` / `mvn clean test`)
#
# Purpose: guarantee that the Spring context always boots in Firebase Mock Mode
# during automated tests, with no external network calls (Firestore/Storage/ADC),
# so `mvn clean test` is fast and deterministic in any environment (including
# offline CI runners and sandboxes with restricted network egress).

# Force mock mode regardless of any FIREBASE_MOCK_ENABLED value set in the shell.
firebase.mock.enabled=true

# Explicitly blank so no accidental local service-account file/json is picked up
# during tests.
firebase.credentials.path=
firebase.credentials.json=
firebase.storage.bucket=interiorai-studio-test.appspot.com

# Keep test logs focused on this app's own log lines.
logging.level.com.interiorai.backend=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
